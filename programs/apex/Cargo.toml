[package]
name = "apex"
version = "0.1.0"
description = "Apex Commodities Protocol - Advanced Derivatives Trading Platform"
edition = "2021"
license = "MIT"
repository = "https://github.com/seedsower/apexprotocol"

[lib]
crate-type = ["cdylib", "lib"]
name = "apex"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.28.0", features = ["init-if-needed"] }
anchor-spl = "0.28.0"
borsh = "0.10.3"
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
num-derive = "0.4"
num-traits = "0.2"
thiserror = "1.0"
solana-program = "~1.16.0"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }
# Oracle dependencies temporarily removed to resolve conflicts
# pyth-sdk-solana = "0.8.0"
# switchboard-v2 = { version = "0.4.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "~1.16.0"
solana-sdk = "~1.16.0"
tokio = { version = "1.0", features = ["macros"] }
